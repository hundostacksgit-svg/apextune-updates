name: Discord

# The OmniDx Discord: the bot (discord/worker.js, a Cloudflare Worker next to the licence server) deploys itself and
# builds the server (discord/setup.mjs): roles, channels, permissions, the welcome, rules, FAQ, buyers and ticket
# panels, the icon, an invite, the slash commands. One secret beyond the Cloudflare token the licence server uses:
#
#   DISCORD_BOT_TOKEN   discord.com/developers/applications > New Application > Bot > Reset Token > Copy
#
# Optional: DISCORD_GUILD_ID (a secret or a repository variable), only when the bot is in more than one server.
# The first run deploys the bot and, while it is in no server yet, puts the link that adds it on the Summary tab (and
# emails it, when the Gmail secrets are there). Add it to your server, run this again, and the server is built. Every
# later push to discord/ redeploys and brings the server back in line; nothing is posted twice and nothing the owner
# made is deleted.
on:
  push:
    branches: ["claude/omnidx-editing-platform-9phdcc"]
    paths: ["discord/**", "tools/discord-test.mjs", ".github/workflows/discord.yml"]
  workflow_dispatch:

permissions:
  # The server's invite goes into studio/assets/discord.json for the site, and Pages is asked to publish.
  contents: write
  actions: write

concurrency:
  group: discord
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      GUILD_ID: ${{ secrets.DISCORD_GUILD_ID || vars.DISCORD_GUILD_ID }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tickets, closing, transcripts, ratings, /verify and the sweep, against a stand-in Discord: a bot that fails
      # here does not deploy.
      - name: The ticket desk, offline
        run: node ../tools/discord-test.mjs

      - name: Are the secrets there?
        id: ready
        run: |
          {
            echo "## Discord: repository secrets"
            echo "| Secret | Set | What it is for |"
            echo "| --- | --- | --- |"
            for pair in "DISCORD_BOT_TOKEN|**needed**: the bot. discord.com/developers/applications > New Application > Bot > Reset Token" \
                        "CLOUDFLARE_API_TOKEN|**needed**: where the bot runs (the same token the licence server deploys with)" \
                        "GMAIL_USER|optional: the invite links are emailed to you as well" \
                        "DISCORD_GUILD_ID|optional: only when the bot is in more than one server"; do
              name="${pair%%|*}"; why="${pair#*|}"
              val="${!name}"; [ "$name" = "DISCORD_BOT_TOKEN" ] && val="$DISCORD_TOKEN"; [ "$name" = "DISCORD_GUILD_ID" ] && val="$GUILD_ID"
              if [ -n "$val" ]; then echo "| $name | yes | $why |"; else echo "| $name | no | $why |"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$DISCORD_TOKEN" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Discord not deployed::Add the repository secret DISCORD_BOT_TOKEN (Settings > Secrets and variables > Actions), then run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.ready.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      # The application's id and public key come off the token, so nobody copies them from the portal. Transcripts need
      # the message content switch, which a bot in fewer than 100 servers may turn on itself.
      - name: Read the bot
        if: steps.ready.outputs.ready == 'true'
        run: |
          app="$(curl -sS --max-time 20 -H "Authorization: Bot $DISCORD_TOKEN" https://discord.com/api/v10/applications/@me)"
          id="$(printf '%s' "$app" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)"
          key="$(printf '%s' "$app" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("verify_key",""))' 2>/dev/null || true)"
          flags="$(printf '%s' "$app" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("flags",0) or 0)' 2>/dev/null || echo 0)"
          if [ -z "$id" ] || [ -z "$key" ]; then
            echo "::error title=Token refused::Discord did not accept DISCORD_BOT_TOKEN. Developer Portal > your application > Bot > Reset Token, and paste the new one into the secret."
            exit 1
          fi
          echo "APP_ID=$id" >> "$GITHUB_ENV"
          echo "PUBLIC_KEY=$key" >> "$GITHUB_ENV"
          echo "BOT_INVITE=https://discord.com/oauth2/authorize?client_id=$id&scope=bot+applications.commands&permissions=8" >> "$GITHUB_ENV"
          want=$(( flags | (1 << 19) ))
          if [ "$want" != "$flags" ]; then
            curl -sS -o /dev/null -w "message content switch on (%{http_code})\n" -X PATCH -H "Authorization: Bot $DISCORD_TOKEN" -H 'Content-Type: application/json' \
              https://discord.com/api/v10/applications/@me -d "{\"flags\": $want}"
          else
            echo "message content switch already on"
          fi
          echo "application $id"

      - name: Find the account
        if: steps.ready.outputs.ready == 'true'
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "account pinned by CLOUDFLARE_ACCOUNT_ID"; exit 0; fi
          id="$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" 'https://api.cloudflare.com/client/v4/accounts?per_page=5' \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if r else "")' 2>/dev/null || true)"
          if [ -z "$id" ]; then echo "::error title=No account::The Cloudflare token cannot see an account."; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          echo "account: ${id:0:6}..."

      - name: Find or make the database
        if: steps.ready.outputs.ready == 'true'
        run: |
          uuid='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          id="$(npx wrangler d1 list --json 2>/dev/null | python3 -c 'import sys,json
          try:
              for d in json.load(sys.stdin):
                  if d.get("name") == "omnidx-discord": print(d.get("uuid") or d.get("id") or ""); break
          except Exception: pass' || true)"
          if [ -n "$id" ]; then echo "database omnidx-discord found"; else
            out="$(npx wrangler d1 create omnidx-discord 2>&1 || true)"
            id="$(printf '%s' "$out" | grep -oE "$uuid" | head -1 || true)"
            if [ -n "$id" ]; then echo "database omnidx-discord made"; else printf '%s\n' "$out"; fi
          fi
          if [ -z "$id" ]; then echo "::error title=No database::Could not find or make the omnidx-discord D1 database (the token needs D1: Edit)."; exit 1; fi
          sed -i "s/PASTE_YOUR_DATABASE_ID_HERE/$id/" wrangler.toml
          npx wrangler d1 execute omnidx-discord --file=schema.sql --remote --yes

      # The service binding reaches the licence Worker for /verify; if that Worker is not there, the bot deploys
      # without it and /verify uses LICENCE_API.
      - name: Deploy the bot
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -o pipefail
          if ! npx wrangler deploy --var APP_ID:"$APP_ID" --var PUBLIC_KEY:"$PUBLIC_KEY" 2>&1 | tee deploy.log; then
            if grep -qi 'service' deploy.log; then
              echo "deploying without the service binding"
              python3 - <<'PY'
          import re
          s = open('wrangler.toml').read()
          open('wrangler.toml', 'w').write(re.sub(r'\[\[services\]\][^\[]*', '', s))
          PY
              npx wrangler deploy --var APP_ID:"$APP_ID" --var PUBLIC_KEY:"$PUBLIC_KEY" 2>&1 | tee deploy.log
            else
              exit 1
            fi
          fi
          printf '%s' "$DISCORD_TOKEN" | npx wrangler secret put DISCORD_TOKEN >/dev/null && echo "DISCORD_TOKEN: set on the bot"
          url="$(grep -o 'https://[A-Za-z0-9.-]*\.workers\.dev' deploy.log | head -1 || true)"
          if [ -z "$url" ]; then
            sub="$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("result",{}).get("subdomain",""))' 2>/dev/null || true)"
            [ -n "$sub" ] && url="https://omnidx-discord.$sub.workers.dev"
          fi
          if [ -z "$url" ]; then echo "::error title=No URL::Could not find the bot's workers.dev address."; exit 1; fi
          echo "BOT_URL=${url%/}" >> "$GITHUB_ENV"
          for try in 1 2 3 4 5 6; do curl -fsS --max-time 10 "${url%/}/health" && break; sleep 5; done

      # Discord checks the address the moment it is set: a signed PING must come back as PONG, and a badly signed one
      # must be refused. A few tries while the new version spreads.
      - name: Point Discord at the bot
        if: steps.ready.outputs.ready == 'true'
        run: |
          for try in 1 2 3 4 5; do
            code="$(curl -sS -o resp.json -w '%{http_code}' -X PATCH -H "Authorization: Bot $DISCORD_TOKEN" -H 'Content-Type: application/json' \
              https://discord.com/api/v10/applications/@me -d "{\"interactions_endpoint_url\": \"$BOT_URL/interactions\"}")"
            if [ "$code" = "200" ]; then echo "Discord sends interactions to $BOT_URL/interactions"; exit 0; fi
            echo "try $try: $code $(cat resp.json)"; sleep 10
          done
          echo "::error title=Endpoint refused::Discord would not take $BOT_URL/interactions."; exit 1

      - name: Build the server
        id: build
        if: steps.ready.outputs.ready == 'true'
        run: |
          set +e
          node setup.mjs "$RUNNER_TEMP/discord-out"
          code=$?
          set -e
          if [ $code -eq 3 ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Add the bot to your server::Open $BOT_INVITE, pick your server, press Authorize, then run this workflow again."
            { echo "## Next: add the bot to your server"; echo; echo "1. Open this link, pick your server, press **Authorize**:"; echo "   $BOT_INVITE"; echo "2. Run this workflow again (Actions > Discord > Run workflow)."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ $code -eq 0 ] || exit $code
          echo "built=true" >> "$GITHUB_OUTPUT"
          npx wrangler d1 execute omnidx-discord --file="$RUNNER_TEMP/discord-out/config.sql" --remote --yes >/dev/null && echo "the bot knows the server's roles and channels"
          invite="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("invite",""))' "$RUNNER_TEMP/discord-out/discord.json")"
          echo "SERVER_INVITE=$invite" >> "$GITHUB_ENV"
          { echo "## The OmniDx Discord is built"; echo; echo "- Invite people: ${invite:-(no invite: give the bot Manage Server)}"; echo "- Tickets: #open-a-ticket; transcripts and ratings: #ticket-logs (team only)"; echo "- Commands: /ticket open, close, add, remove, claim, rename · /verify · /faq · /stats"; echo "- Give the **OmniDx Team** role to anyone who answers tickets (you have it already)."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Put the invite on the site
        id: site
        if: steps.build.outputs.built == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name 'omnidx-ci'
          git config user.email 'ci@omnidx.net'
          for try in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/discord-out/discord.json" studio/assets/discord.json
            git add studio/assets/discord.json
            if git diff --cached --quiet; then echo 'the site already has this invite'; exit 0; fi
            git commit -q -m "Discord: the server's invite on the site"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "new=true" >> "$GITHUB_OUTPUT"
              curl -sS -o /dev/null -w 'Pages asked to publish (%{http_code})\n' -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" -d "{\"ref\":\"$GITHUB_REF_NAME\"}"
              exit 0
            fi
            echo "push refused on try $try; the branch moved"; sleep 5
          done
          exit 1

      # From a phone the links are easier in an inbox than on the Summary tab: once while the bot waits to be added,
      # once when the server is first built (or its invite changes), never on an ordinary redeploy.
      - name: Email the links
        if: steps.ready.outputs.ready == 'true' && env.GMAIL_USER != '' && env.GMAIL_APP_PASSWORD != '' && (steps.build.outputs.built == 'false' || steps.site.outputs.new == 'true')
        env:
          BUILT: ${{ steps.build.outputs.built }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          user = os.environ['GMAIL_USER'].strip(); built = os.environ.get('BUILT') == 'true'
          m = EmailMessage(); m['From'] = f'OmniDx <{user}>'; m['To'] = user
          if built:
              m['Subject'] = 'OmniDx Discord: built'
              body = ['Your OmniDx Discord is built.', '', f"Invite people: {os.environ.get('SERVER_INVITE') or '(no invite yet)'}", '',
                      'Tickets open from #open-a-ticket; closed ones land in #ticket-logs with the whole conversation and the rating.',
                      'Give the OmniDx Team role to anyone who answers tickets (you have it).',
                      'Commands: /ticket open, close, add, remove, claim, rename; /verify; /faq; /stats.']
          else:
              m['Subject'] = 'OmniDx Discord: one tap left'
              body = ['The OmniDx bot is running. Add it to your server:', '', f"  {os.environ['BOT_INVITE']}", '',
                      'Pick your server, press Authorize, then run the Discord workflow again (GitHub > Actions > Discord > Run workflow).',
                      'It builds every channel, role and panel by itself.']
          m.set_content('\n'.join(body) + '\n')
          with smtplib.SMTP_SSL('smtp.gmail.com', 465, context=ssl.create_default_context(), timeout=30) as s:
              s.login(user, os.environ['GMAIL_APP_PASSWORD']); s.send_message(m)
          print('emailed', user[:2] + '***')
          PY
