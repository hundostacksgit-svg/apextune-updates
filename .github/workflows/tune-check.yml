name: Check the tune

# The tune is a PowerShell script nobody here can run without Windows. This
# does two things on a real Windows runner every time it changes: parses both
# scripts with PowerShell's own parser (a syntax error would otherwise ship),
# and runs the tune in report mode, which reads the machine and changes
# nothing. The bootstrapper's option parsing is exercised the same way.
on:
  push:
    branches: [main, master, "claude/omnidx-editing-platform-9phdcc"]
    paths: ["tune/**", "go.ps1", "tools/tune-check.mjs", ".github/workflows/tune-check.yml"]
  pull_request:
    paths: ["tune/**", "go.ps1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ASCII, brackets, key maths, config
        run: node tools/tune-check.mjs

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      # The runner is Windows Server, which the tune refuses; report mode is
      # let through here so the read, the preview and the key check can run.
      OMNIDX_ALLOW_SERVER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Parse both scripts with PowerShell's parser
        run: |
          foreach ($f in 'tune\omnidx.ps1', 'go.ps1') {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Host ("{0}: {1} at line {2}" -f $f, $_.Message, $_.Extent.StartLineNumber) }; exit 1 }
            Write-Host "$f parses ($($tokens.Count) tokens)"
          }

      - name: Run the tune in report mode (changes nothing)
        run: |
          & .\tune\omnidx.ps1 -Report
          if (-not (Test-Path 'C:\OmniDx')) { Write-Host 'no C:\OmniDx folder was made'; exit 1 }
          Get-ChildItem C:\OmniDx | ForEach-Object { Write-Host $_.Name }
          $preview = Get-ChildItem C:\OmniDx -Filter 'report-preview-*.txt' | Select-Object -First 1
          if (-not $preview) { Write-Host 'no preview report was written'; exit 1 }
          Get-Content $preview.FullName

      - name: Undo with nothing recorded says so
        run: |
          & .\tune\omnidx.ps1 -Undo
          exit 0

      - name: The key check refuses a bad key
        run: |
          $out = & .\tune\omnidx.ps1 -Key 'TUNE-AAAA-BBBB-CCCC-DDDD' -CheckKey *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'not an OmniDx key') { Write-Host 'a bad key was not refused'; exit 1 }

      # The four implementations of the checksum must agree. The Python tool
      # (already checked against the browser module) makes keys; the script
      # must accept every one and refuse every one with a digit changed.
      - name: The key check accepts keys the Python tool makes
        run: |
          foreach ($product in 'tune', 'squad') {
            foreach ($i in 1..3) {
              $key = (& python tools\make-tune-key.py --product $product | Select-Object -First 1).Trim()
              $out = & .\tune\omnidx.ps1 -Key $key -CheckKey *>&1 | Out-String
              if ($out -notmatch 'Valid:') { Write-Host "refused a good key: $key`n$out"; exit 1 }
              $bad = $key.Substring(0, $key.Length - 1) + $(if ($key[-1] -eq 'A') { 'B' } else { 'A' })
              $out = & .\tune\omnidx.ps1 -Key $bad -CheckKey *>&1 | Out-String
              if ($out -notmatch 'not an OmniDx key') { Write-Host "accepted a corrupted key: $bad`n$out"; exit 1 }
              Write-Host "$key accepted; $bad refused"
            }
          }
          $order = (& python tools\make-tune-key.py --order TESTORDER123456 | Select-Object -First 1).Trim()
          $out = & .\tune\omnidx.ps1 -Key $order -CheckKey *>&1 | Out-String
          if ($out -notmatch 'Valid:') { Write-Host "refused the order-derived key: $order`n$out"; exit 1 }
          Write-Host "order-derived key $order accepted"
