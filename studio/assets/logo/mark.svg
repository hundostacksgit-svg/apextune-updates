<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="OmniDx Tune">
  <!--
    The mark. Three bars getting shorter: the process list, cut. A bolt through
    the gap: the one command that does it. Purple to magenta, on black.
    Built to survive 16 pixels: the bars stay readable as three strokes and the
    bolt as one bright shape.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ead9ff"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="60" fill="url(#bg)"/>
  <rect width="256" height="256" rx="60" fill="url(#sheen)"/>
  <rect x="10" y="10" width="236" height="236" rx="52" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
  <g fill="#fff">
    <rect x="46" y="66" width="118" height="24" rx="12" opacity=".96"/>
    <rect x="46" y="116" width="80" height="24" rx="12" opacity=".72"/>
    <rect x="46" y="166" width="44" height="24" rx="12" opacity=".46"/>
  </g>
  <path d="M188 46 L146 130 L178 130 L160 210 L214 108 L182 108 Z" fill="url(#bolt)" filter="url(#glow)"/>
</svg>
