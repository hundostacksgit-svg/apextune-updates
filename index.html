<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniDx Studio — the video editor that cuts itself</title>
<meta name="description" content="A full multitrack video editor with an AI that turns a sentence into a finished edit. Free, no watermark, works offline, on Mac, Windows, iOS, Android and the browser.">
<meta name="theme-color" content="#04060d">
<link rel="icon" href="studio/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="studio/assets/icons/apple-touch-icon.png">

<!-- omnidx.net is OmniDx Studio's address. The page a visitor wants is one
     directory down, and GitHub Pages has no server-side rewrites — only real
     files — so this sends them on.

     Three ways, deliberately. The canonical tag tells search engines which page
     this really is, so the redirect does not split ranking between two URLs.
     The refresh works with JavaScript switched off. The script fires first in a
     normal browser and uses `replace`, which keeps the redirect out of history
     — otherwise Back from /studio/ lands here and bounces straight forward
     again, and the visitor is trapped.

     The preview tags are Studio's, so a link to omnidx.net shared into iMessage
     or Discord shows the editor's card rather than a blank redirect page. -->
<link rel="canonical" href="https://omnidx.net/studio/">
<meta http-equiv="refresh" content="0; url=studio/">

<meta property="og:site_name" content="OmniDx Studio">
<meta property="og:title" content="OmniDx Studio — the video editor that cuts itself">
<meta property="og:description" content="A full multitrack video editor with an AI that turns a sentence into a finished edit. Free, no watermark, works offline, on Mac, Windows, iOS, Android and the browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://omnidx.net/studio/">
<meta property="og:image" content="https://omnidx.net/studio/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="OmniDx Studio: a video editor timeline with clips cut to the beat of a music track.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="OmniDx Studio — the video editor that cuts itself">
<meta name="twitter:description" content="A full multitrack video editor with an AI that turns a sentence into a finished edit. Free, no watermark, works offline.">
<meta name="twitter:image" content="https://omnidx.net/studio/assets/og-card.png">

<script>location.replace('studio/' + location.search + location.hash);</script>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
    background:#04060d;color:#e9eefc;padding:24px;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif}
  .mark{width:56px;height:56px;border-radius:16px;margin:0 auto 20px;display:grid;place-items:center;
    background:linear-gradient(125deg,#7a5cff,#2f7dff 45%,#00d1ff);
    box-shadow:0 12px 34px -10px rgba(47,125,255,.5)}
  h1{font-size:22px;font-weight:750;letter-spacing:-.02em;margin:0 0 8px}
  p{color:#9aa6c4;margin:0 0 22px;font-size:15px}
  a.go{display:inline-block;padding:13px 26px;border-radius:12px;font-weight:640;color:#fff;
    text-decoration:none;background:linear-gradient(125deg,#7a5cff,#2f7dff 45%,#00d1ff)}
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" style="width:30px;height:30px">
        <rect x="13" y="18" width="26" height="6" rx="3" fill="#fff" opacity=".92"/>
        <rect x="13" y="29" width="18" height="6" rx="3" fill="#fff" opacity=".68"/>
        <rect x="13" y="40" width="30" height="6" rx="3" fill="#fff" opacity=".45"/>
        <path d="M43 24.5 L54 32 L43 39.5 Z" fill="#fff"/>
      </svg>
    </div>
    <h1>OmniDx Studio</h1>
    <p>Taking you to the editor…</p>
    <a class="go" href="studio/">Open OmniDx Studio</a>
  </main>
</body>
</html>
