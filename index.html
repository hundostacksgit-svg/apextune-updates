<!-- omnidx.net is OmniDx Tune's address. The page a visitor wants is one
     directory down, and GitHub Pages has no server-side rewrites — only real
     files — so this sends them on.

     Three ways, deliberately. The canonical tag tells search engines which page
     this really is, so the redirect does not split ranking between two URLs.
     The refresh works with JavaScript switched off. The script fires first in a
     normal browser and uses `replace`, which keeps the redirect out of history
     — otherwise Back from /studio/ lands here and bounces straight forward
     again, and the visitor is trapped.

     The preview tags are the site's, so a link to omnidx.net shared into iMessage
     or Discord shows the real card rather than a blank redirect page. -->
<link rel="canonical" href="https://omnidx.net/studio/">
<meta http-equiv="refresh" content="0; url=studio/">

<meta property="og:site_name" content="OmniDx Tune">
<meta property="og:title" content="OmniDx Tune — 200 processes. Under 100. One command.">
