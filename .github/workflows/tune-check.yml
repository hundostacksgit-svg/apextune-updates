name: Check the tune

# The tune is a PowerShell script nobody here can run without Windows. This
# does two things on a real Windows runner every time it changes: parses both
# scripts with PowerShell's own parser (a syntax error would otherwise ship),
# and runs the tune in report mode, which reads the machine and changes
# nothing. The bootstrapper's option parsing is exercised the same way.
on:
  push:
    branches: [main, master, "claude/omnidx-editing-platform-9phdcc"]
    paths: ["tune/**", "go.ps1", "tools/tune-check.mjs", ".github/workflows/tune-check.yml"]
  pull_request:
    paths: ["tune/**", "go.ps1"]
  workflow_dispatch:

permissions:
  # The Windows job commits the window's screenshot back to the branch, so
  # the site always shows the app exactly as the current script draws it.
  contents: write

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ASCII, brackets, key maths, config
        run: node tools/tune-check.mjs

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      # The runner is Windows Server, which the tune refuses; report mode is
      # let through here so the read, the preview and the key check can run.
      OMNIDX_ALLOW_SERVER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Parse both scripts with PowerShell's parser
        run: |
          foreach ($f in 'tune\omnidx.ps1', 'go.ps1') {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Host ("{0}: {1} at line {2}" -f $f, $_.Message, $_.Extent.StartLineNumber) }; exit 1 }
            Write-Host "$f parses ($($tokens.Count) tokens)"
          }

      - name: Run the tune in report mode (changes nothing)
        run: |
          & .\tune\omnidx.ps1 -Report
          if (-not (Test-Path 'C:\OmniDx')) { Write-Host 'no C:\OmniDx folder was made'; exit 1 }
          Get-ChildItem C:\OmniDx | ForEach-Object { Write-Host $_.Name }
          $preview = Get-ChildItem C:\OmniDx -Filter 'report-preview-*.txt' | Select-Object -First 1
          if (-not $preview) { Write-Host 'no preview report was written'; exit 1 }
          Get-Content $preview.FullName
          exit 0

      - name: The script can see its own text, from a file and from memory
        run: |
          $a = & .\tune\omnidx.ps1 -SelfTest *>&1 | Out-String
          $b = & ([scriptblock]::Create((Get-Content .\tune\omnidx.ps1 -Raw))) -SelfTest *>&1 | Out-String
          Write-Host $a; Write-Host $b
          foreach ($o in $a, $b) { if ($o -notmatch 'self text: (\d+) chars' -or [int]$Matches[1] -lt 10000) { Write-Host 'the script cannot see itself'; exit 1 } }
          foreach ($o in $a, $b) { if ($o -notmatch "runspace probe: \d+ output objects, (\d+) info lines, cpu '.+', (\d+) processes, 0 errors" -or [int]$Matches[1] -lt 3 -or [int]$Matches[2] -lt 10) { Write-Host 'the background runspace did not deliver the probe and its log'; exit 1 } }
          exit 0

      - name: Probe mode prints one JSON object for the app
        run: |
          $j = & .\tune\omnidx.ps1 -Probe | Select-Object -Last 1
          $o = $j | ConvertFrom-Json
          Write-Host ("probe: {0} processes, target {1}, {2} startup entries, {3} warnings" -f $o.before, $o.target, @($o.startup).Count, @($o.warnings).Count)
          if (-not $o.cpu -or -not $o.before) { Write-Host 'probe is missing fields'; exit 1 }
          exit 0

      - name: Draw the app window to a PNG without showing it
        run: |
          & .\tune\omnidx.ps1 -Gui -Screenshot C:\OmniDx\app.png
          if (-not (Test-Path C:\OmniDx\app.png)) { Write-Host 'no screenshot was drawn'; exit 1 }
          Write-Host ("app.png: {0} bytes" -f (Get-Item C:\OmniDx\app.png).Length)
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: app-window
          path: C:\OmniDx\app.png
          if-no-files-found: error

      - name: Undo with nothing recorded says so
        run: |
          & .\tune\omnidx.ps1 -Undo
          exit 0

      # The real thing, on a machine nobody needs afterwards: a valid key,
      # every phase, no prompts, no restart. Then undo. Then the numbers go to
      # the site, so every visitor sees the last run on a fresh Windows.
      - name: Run the whole tune with a real key
        run: |
          $key = (& python tools\make-tune-key.py | Select-Object -First 1).Trim()
          $out = & .\tune\omnidx.ps1 -Key $key -Yes -NoRestart -NoAfterCount *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch '== Done') { Write-Host 'the tune did not reach Done'; exit 1 }
          if ($out -notmatch 'Processes: (\d+) -> (\d+)') { Write-Host 'no before/after line'; exit 1 }
          $html = Get-ChildItem C:\OmniDx -Filter 'report-*.html' | Select-Object -First 1
          if (-not $html) { Write-Host 'no HTML report'; exit 1 }
          if (-not (Test-Path C:\OmniDx\undo\changes-latest.json)) { Write-Host 'no change record'; exit 1 }
          $summary = Get-ChildItem C:\OmniDx -Filter 'summary-*.json' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $summary.FullName C:\OmniDx\ci-summary.json
          Get-Content C:\OmniDx\ci-summary.json
          exit 0

      - name: Undo the whole tune
        run: |
          $out = & .\tune\omnidx.ps1 -Undo *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Done: (\d+) put back') { Write-Host 'undo did not finish'; exit 1 }
          $undone = [int]$Matches[1]
          $s = Get-Content C:\OmniDx\ci-summary.json | ConvertFrom-Json
          $ci = [ordered]@{ version = $s.version; when = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'); os = $s.os; cpu = $s.cpu; before = $s.before; after = $s.after; target = $s.target; changes = $s.changes; warnings = $s.warnings; seconds = $s.seconds; undone = $undone; gone = @($s.gone).Count; sha = $env:GITHUB_SHA.Substring(0, 7) }
          $ci | ConvertTo-Json | Set-Content studio\assets\ci-run.json -Encoding UTF8
          Get-Content studio\assets\ci-run.json
          exit 0

      - name: The key check refuses a bad key
        run: |
          $out = & .\tune\omnidx.ps1 -Key 'TUNE-AAAA-BBBB-CCCC-DDDD' -CheckKey *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'not an OmniDx key') { Write-Host 'a bad key was not refused'; exit 1 }
          exit 0

      # The four implementations of the checksum must agree. The Python tool
      # (already checked against the browser module) makes keys; the script
      # must accept every one and refuse every one with a digit changed.
      - name: The key check accepts keys the Python tool makes
        run: |
          foreach ($product in 'tune', 'squad') {
            foreach ($i in 1..3) {
              $key = (& python tools\make-tune-key.py --product $product | Select-Object -First 1).Trim()
              $out = & .\tune\omnidx.ps1 -Key $key -CheckKey *>&1 | Out-String
              if ($out -notmatch 'Valid:') { Write-Host "refused a good key: $key`n$out"; exit 1 }
              $bad = $key.Substring(0, $key.Length - 1) + $(if ($key[-1] -eq 'A') { 'B' } else { 'A' })
              $out = & .\tune\omnidx.ps1 -Key $bad -CheckKey *>&1 | Out-String
              if ($out -notmatch 'not an OmniDx key') { Write-Host "accepted a corrupted key: $bad`n$out"; exit 1 }
              Write-Host "$key accepted; $bad refused"
            }
          }
          $order = (& python tools\make-tune-key.py --order TESTORDER123456 | Select-Object -First 1).Trim()
          $out = & .\tune\omnidx.ps1 -Key $order -CheckKey *>&1 | Out-String
          if ($out -notmatch 'Valid:') { Write-Host "refused the order-derived key: $order`n$out"; exit 1 }
          Write-Host "order-derived key $order accepted"
          exit 0

      # The screenshot goes into the repository as the site's picture of the
      # app. A push made with the workflow token starts no other workflow, so
      # the picture reaches the site with the next ordinary push.
      - name: Commit the screenshot and the run's numbers to the branch
        if: github.event_name == 'push'
        run: |
          Copy-Item C:\OmniDx\app.png studio\assets\app.png -Force
          git config user.name 'omnidx-ci'
          git config user.email 'ci@omnidx.net'
          git add studio/assets/app.png studio/assets/ci-run.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'nothing changed'; exit 0 }
          git commit -q -m 'Windows check: the app window and the numbers from running the tune'
          git pull --rebase -q origin $env:GITHUB_REF_NAME
          git push -q origin HEAD:$env:GITHUB_REF_NAME
          exit 0
