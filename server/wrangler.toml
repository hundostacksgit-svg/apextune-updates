name = "omnidx-studio-api"
main = "worker.js"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# The database holding accounts, devices and licences.
# Create it once:  npx wrangler d1 create omnidx-studio
# then paste the id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "omnidx-studio"
database_id = "PASTE_YOUR_DATABASE_ID_HERE"

# On the hour: Square is asked about refunds (no webhook needed; a refunded order's keys go off within the hour).
# Monday, 13:00 UTC: the week's orders, money and refunds, emailed to SUPPORT_EMAIL.
[triggers]
crons = ["0 * * * *", "0 13 * * 1"]

[vars]
# Comma-separated list of sites allowed to call this API. Set it before you go
# live — with it empty the Worker echoes whatever origin asks, which is handy
# in development and too permissive in public.
ALLOWED_ORIGINS = "https://omnidx.net,https://hundostacksgit-svg.github.io"

# Raise or lower against your Workers plan's CPU allowance. 210,000 is a good
# figure on the paid plan; the free plan's 10ms limit will reject logins, so
# drop to 60000 there and understand you are trading away some resistance to an
# offline attack on a stolen database.
PBKDF2_ROUNDS = "210000"

# The model the AI planner uses.
CLAUDE_MODEL = "claude-opus-5"

MAIL_FROM = "OmniDx Studio <keys@omnidx.net>"
# The display name on the key emails. Through Gmail (GMAIL_USER, GMAIL_APP_PASSWORD) the address is the
# Gmail account itself; through Resend the address here must belong to a domain Resend has verified.
TUNE_MAIL_FROM = "OmniDx Tune <keys@omnidx.net>"
SUPPORT_EMAIL = "ahmirpierce36@gmail.com"
# The exact notification URL registered for the Square webhook: this Worker's
# URL plus /v1/webhooks/square. Square signs each call with it; the deploy
# workflow fills it in from the Worker's URL.
SQUARE_WEBHOOK_URL = ""
# Where password-reset links point, and a pepper for the fake salts that hide
# which emails have accounts. Set the pepper to any long random string.
SITE_URL = "https://omnidx.net"
SALT_PEPPER = "change-me-to-a-long-random-string"

# Secrets are NOT set here — they would end up in git. Set each one with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put GMAIL_USER          (the owner's Gmail address: the Tune keys go to buyers from it)
#   npx wrangler secret put GMAIL_APP_PASSWORD  (an app password for it; Google Account > Security > 2-Step Verification > App passwords)
#   npx wrangler secret put RESEND_API_KEY      (Resend instead of Gmail; needs a verified domain)
#   npx wrangler secret put SQUARE_ACCESS_TOKEN (confirms Square orders; keys are not issued without it)
#   npx wrangler secret put SQUARE_WEBHOOK_SIGNATURE_KEY (from the webhook subscription in the Square developer dashboard)
# The deploy workflow sets every one of these from the repository's secrets, so
# none of them has to be typed into a terminal.
#   npx wrangler secret put STT_URL             (optional — transcription)
#   npx wrangler secret put STT_KEY
#   npx wrangler secret put SQUARE_ACCESS_TOKEN (optional — lets /v1/tune/issue
#                                               confirm each order with Square
#                                               before handing out a Tune key)
