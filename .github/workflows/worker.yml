name: Deploy the Worker

# The API deploys itself. A push that touches server/ (or a press of the
# button) creates any missing tables and deploys the Worker; every six hours
# a health check hits it, and a failing check redeploys rather than pages
# anyone. The schema is additive (every statement is IF NOT EXISTS), so
# re-running it is always safe.
#
# It needs three repository secrets, and does nothing but say so until they
# exist — a fork or a checkout without a Cloudflare account must not go red:
#   CLOUDFLARE_API_TOKEN   a token with Workers Scripts:Edit and D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard's right-hand column
#   CLOUDFLARE_D1_ID       the id "wrangler d1 create omnidx-studio" printed
# and one optional repository variable:
#   WORKER_URL             e.g. https://omnidx-studio-api.<you>.workers.dev
#                          (used by the health check; found from the deploy
#                          output when unset)
on:
  push:
    branches: [main, master, "claude/omnidx-editing-platform-9phdcc"]
    paths: ["server/**", ".github/workflows/worker.yml"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
      WORKER_URL: ${{ vars.WORKER_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Are the secrets there?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_D1_ID" ]; then
            echo "Cloudflare secrets are not set on this repository, so there is nothing to deploy to."
            echo "Set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_D1_ID under Settings → Secrets, or run server/deploy.sh by hand."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.ready.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Point the config at the database
        if: steps.ready.outputs.ready == 'true'
        run: sed -i "s/PASTE_YOUR_DATABASE_ID_HERE/$CLOUDFLARE_D1_ID/" wrangler.toml

      # On a scheduled run, deploy only when the Worker is not answering.
      - name: Health check (scheduled runs)
        id: health
        if: steps.ready.outputs.ready == 'true' && github.event_name == 'schedule'
        run: |
          url="$WORKER_URL"
          if [ -z "$url" ]; then
            url="$(npx wrangler deployments list 2>/dev/null | grep -o 'https://[^ ]*workers.dev' | head -1 || true)"
          fi
          if [ -z "$url" ]; then echo "No URL to check; deploying to be safe."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if curl -fsS --max-time 20 "$url/v1/health" >/dev/null; then
            echo "$url answers."; echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "$url did not answer — redeploying."; echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create any missing tables
        if: steps.ready.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.health.outputs.ok != 'true')
        run: npx wrangler d1 execute omnidx-studio --file=schema.sql --remote --yes

      - name: Deploy
        if: steps.ready.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.health.outputs.ok != 'true')
        run: npx wrangler deploy

      - name: Check it answers
        if: steps.ready.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.health.outputs.ok != 'true')
        run: |
          url="$WORKER_URL"
          if [ -z "$url" ]; then
            url="$(npx wrangler deployments list 2>/dev/null | grep -o 'https://[^ ]*workers.dev' | head -1 || true)"
          fi
          if [ -n "$url" ]; then
            for i in 1 2 3 4 5 6; do
              if curl -fsS --max-time 20 "$url/v1/health"; then echo; echo "Live at $url"; exit 0; fi
              sleep 10
            done
            echo "Deployed, but $url/v1/health did not answer within a minute."; exit 1
          else
            echo "Deployed. Set the WORKER_URL repository variable so the health check knows where to look."
          fi
