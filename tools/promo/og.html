<!doctype html><html><head><meta charset="utf-8"><title>og</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#08090c}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  color:#e9ecf2;-webkit-font-smoothing:antialiased}
#s{position:relative;width:1200px;height:630px;overflow:hidden;
  background:radial-gradient(900px 520px at 78% 12%,rgba(255,158,43,.20),transparent 62%),#08090c}
.left{position:absolute;left:72px;top:0;bottom:0;width:660px;display:flex;flex-direction:column;
  justify-content:center;gap:20px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:64px;height:64px;border-radius:16px}
.brand span{font-size:50px;font-weight:800;letter-spacing:-.02em}
h1{font-size:54px;line-height:1.06;font-weight:800;letter-spacing:-.035em}
.grad{background:linear-gradient(115deg,#ff9e2b,#ff4a3a);-webkit-background-clip:text;
  background-clip:text;color:transparent}
p{font-size:24px;line-height:1.45;color:#a3abbb;max-width:590px}
.eyebrow{font-size:19px;font-weight:800;letter-spacing:.16em;color:#ff9e2b}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:9px 20px;border:2px solid #2c313d;border-radius:999px;font-size:20px;
  font-weight:700;color:#cdd3df}
.chip.on{border-color:#ff9e2b;color:#ff9e2b}
.shot{position:absolute;right:64px;top:50%;transform:translateY(-50%) rotate(-4deg);
  width:330px;border:10px solid #171b23;border-radius:34px;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.75);background:#0b0c10}
.shot img{display:block;width:100%;margin-top:-118px}
.shot{height:472px}
.url{position:absolute;left:72px;bottom:44px;font-size:22px;font-weight:700;color:#6f7889;
  letter-spacing:.06em}
</style></head><body>
<div id="s">
  <div class="left">
    <div class="brand"><img src="/icons/icon-512.png"><span>OmniDx</span></div>
    <div class="eyebrow">ALL-AROUND DIAGNOSTICS</div>
    <h1>Your car is telling you<br>what's wrong.<br><span class="grad">Read it yourself.</span></h1>
    <p>Engine trouble codes with the likely cause and the cheapest fix first —
       plus your phone, laptop, controller and screen. Works offline.</p>
    <div class="chips">
      <span class="chip on">Car</span><span class="chip">Phone</span>
      <span class="chip">Laptop</span><span class="chip">Controller</span>
      <span class="chip">Screen</span>
    </div>
  </div>
  <div class="shot"><img src="/assets/shots/car-results.png"></div>

</div>
</body></html>
