name: Publish to GitHub Pages

# Pages serves this repository from the gh-pages branch, so publishing is a
# matter of mirroring the pushed commit onto that branch. This needs only
# contents:write — no Pages API call, and no repository setting to switch on.
on:
  push:
    branches: [main, master, "claude/universal-diagnostics-app-6x8tot", "claude/omnidx-editing-platform-9phdcc"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the site is complete
        run: |
          set -euo pipefail
          for f in index.html .nojekyll \
                   app/index.html app/manifest.webmanifest app/sw.js app/css/app.css \
                   app/js/app.js app/js/ui.js app/js/store.js app/js/report.js \
                   app/js/pro.js app/js/config.js app/js/modules/pro.js \
                   app/js/modules/car.js app/js/modules/codes.js app/js/modules/garage.js \
                   app/js/obd/elm327.js app/js/obd/transport.js app/js/obd/pids.js app/js/obd/dtc.js \
                   app/js/obd/repairs.js app/js/modules/controller.js app/js/modules/display.js \
                   icons/icon-192.png icons/icon-512.png icons/icon.ico icons/icon.icns; do
            [ -f "$f" ] || { echo "missing required file: $f"; exit 1; }
          done
          for f in studio/index.html studio/pricing/index.html studio/download/index.html \
                   studio/account/index.html studio/activate/index.html studio/activate/activate.js \
                   studio/assets/studio.css studio/assets/studio.js \
                   studio/assets/config.js studio/assets/auth.js studio/assets/mark.svg \
                   studio/assets/og-card.png \
                   studio/assets/icons/icon-192.png studio/assets/icons/icon-512.png \
                   studio/assets/icons/maskable-192.png studio/assets/icons/maskable-512.png \
                   studio/assets/icons/apple-touch-icon.png \
                   studio/app/index.html studio/app/manifest.webmanifest studio/app/sw.js \
                   studio/app/css/app.css studio/app/js/main.js studio/app/js/ui.js \
                   studio/app/js/store.js studio/app/js/licence.js studio/app/js/levels.js \
                   studio/app/js/timeline-ui.js studio/app/js/palette.js studio/app/js/tutorial.js \
                   studio/app/js/mobile.js studio/app/js/menubar.js \
                   studio/app/js/history-ui.js studio/app/js/tips.js \
                   studio/app/js/desktop.js studio/app/js/updates.js version.json \
                   studio/app/js/engine/effects.js studio/app/js/engine/stickers.js \
                   studio/app/js/engine/templates-library.js studio/app/js/engine/templates.js studio/app/js/engine/tracking.js \
                   studio/app/js/engine/muxer.js studio/app/js/engine/exporter-wc.js \
                   studio/app/js/engine/audio-render.js studio/app/js/engine/audio-repair.js \
                   studio/app/js/engine/audio-fx.js studio/app/js/engine/reference.js \
                   studio/app/js/engine/looks-library.js studio/app/js/engine/share.js \
                   studio/app/js/engine/transitions-library.js \
                   studio/app/js/panels/transition-picker.js \
                   studio/app/js/engine/effects-library.js studio/app/js/engine/fx-utils.js \
                   studio/app/js/engine/fonts-library.js studio/app/js/engine/preview.js \
                   studio/app/js/engine/lut.js studio/app/js/panels/curves.js \
                   studio/app/js/engine/multiframe.js studio/app/js/engine/matte.js \
                   studio/app/js/engine/tags.js studio/app/js/engine/brand.js \
                   studio/app/js/engine/scopes.js studio/app/js/engine/meters.js \
                   studio/app/js/engine/bundle.js studio/app/js/engine/proxy.js \
                   studio/app/js/panels/templates.js studio/app/js/panels/tracking.js \
                   studio/app/js/engine/project.js studio/app/js/engine/render.js \
                   studio/app/js/engine/filters.js studio/app/js/engine/transitions.js \
                   studio/app/js/engine/titles.js studio/app/js/engine/media.js \
                   studio/app/js/engine/audio.js studio/app/js/engine/playback.js \
                   studio/app/js/engine/exporter.js studio/app/js/engine/history.js \
                   studio/app/js/ai/planner.js studio/app/js/ai/apply.js studio/app/js/ai/remote.js \
                   studio/app/js/ai/direct.js \
                   studio/app/js/panels/index.js studio/app/js/panels/media.js \
                   studio/app/js/panels/ai.js studio/app/js/panels/effects.js \
                   studio/app/js/panels/color.js studio/app/js/panels/text.js \
                   studio/app/js/panels/audio.js studio/app/js/panels/captions.js \
                   studio/app/js/panels/settings.js studio/app/js/panels/help.js \
                   studio/app/js/panels/inspector.js studio/app/js/panels/export.js \
                   server/worker.js server/schema.sql; do
            [ -f "$f" ] || { echo "missing required file: $f"; exit 1; }
          done
          python3 -c "import json; json.load(open('app/manifest.webmanifest'))"
          python3 -c "import json; json.load(open('studio/app/manifest.webmanifest'))"
          python3 -c "import json; json.load(open('version.json'))"
          python3 -c "import json; json.load(open('studio/desktop/package.json'))"
          python3 -c "import json; json.load(open('studio/mobile/capacitor.config.json'))"
          python3 -m py_compile tools/sysreport.py tools/make-licence.py tools/set-domain.py \
            tools/make-studio-key.py tools/release.py \
            desktop/omnidx.py desktop/install.py

          # The root must send visitors to Studio, or omnidx.net is a dead page.
          grep -q 'url=studio/' index.html || { echo "root index.html no longer redirects to studio/"; exit 1; }
          grep -q "location.replace('studio/" index.html || { echo "root index.html lost its script redirect"; exit 1; }
          echo "site looks complete"

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          # gh-pages is a deploy branch that nothing else writes, so forcing it
          # to match the commit being published is always the correct result.
          git push origin "HEAD:refs/heads/gh-pages" --force
          echo "published ${GITHUB_SHA} to gh-pages"
