name: Deploy the API Worker

# The Worker is what makes the AI, real accounts and Team seats work. It is
# deployed from here so a change to server/ reaches production by pushing,
# rather than by remembering to run wrangler on the right machine.
#
# One-time setup, and then it looks after itself:
#   1. Cloudflare dashboard → My Profile → API Tokens → Create Token
#      → "Edit Cloudflare Workers" template. Copy the token.
#   2. This repo → Settings → Secrets and variables → Actions → New secret
#      → name: CLOUDFLARE_API_TOKEN, value: the token.
#   3. Add CLOUDFLARE_ACCOUNT_ID the same way (dashboard sidebar, right side).
#
# Without those secrets this workflow skips itself quietly rather than failing
# every push, because most people cloning this repo will not have a Worker.

on:
  push:
    branches: [main, master, "claude/omnidx-editing-platform-9phdcc"]
    paths:
      - 'server/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false      # never cancel a half-finished deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is a Cloudflare token configured?
        id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_API_TOKEN secret, so the Worker was not deployed."
            echo "::notice::The app works without it — the AI planner runs on the device."
            echo "::notice::To enable it, see the comments at the top of this workflow."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'yes'
        with:
          node-version: '20'

      - name: Install
        if: steps.check.outputs.ready == 'yes'
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Check the Worker parses before deploying it
        if: steps.check.outputs.ready == 'yes'
        working-directory: server
        run: |
          cp worker.js /tmp/worker-check.mjs
          node --check /tmp/worker-check.mjs
          echo "worker.js is valid"

      - name: Apply any new tables
        if: steps.check.outputs.ready == 'yes'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Every statement is CREATE TABLE IF NOT EXISTS, so this is safe to run
        # on every deploy and does nothing when the schema has not changed.
        run: npx wrangler d1 execute omnidx-studio --file=schema.sql --remote --yes || true

      - name: Deploy
        if: steps.check.outputs.ready == 'yes'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Check it answers
        if: steps.check.outputs.ready == 'yes'
        env:
          API_URL: ${{ secrets.API_URL }}
        # A deploy that succeeds and a Worker that works are different things.
        run: |
          if [ -z "$API_URL" ]; then
            echo "::notice::Set an API_URL secret to have this step verify the deploy."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$API_URL/v1/health" | tee /tmp/health.json; then
              echo ""
              grep -q '"ok":true' /tmp/health.json && { echo "healthy"; exit 0; }
            fi
            echo "not answering yet, retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::The Worker deployed but /v1/health did not come back healthy."
          exit 1
